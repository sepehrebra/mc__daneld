name: farmapp

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file: .env
    volumes:
      - db_data:/data            # SQLite file lives here and survives redeploys
    expose:
      - "8000"                   # internal only, never published to the host
    healthcheck:
      # Needs 127.0.0.1 in DJANGO_ALLOWED_HOSTS (it is in .env.example)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_API_URL: /api/v1
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"            # HTTP/3
    volumes:
      - caddy_data:/data         # TLS certificates, must persist
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config: